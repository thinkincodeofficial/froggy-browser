# Builds the Froggy installers on Windows, macOS and Linux.
# - Run it by hand from the Actions tab ("Run workflow"): installers are attached to the run as artifacts.
# - Push a version tag (e.g. `git tag v0.1.0 && git push --tags`): installers are also published as a GitHub Release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            files: dist/*.exe
          - os: macos-latest
            platform: mac
            files: dist/*.dmg
          - os: ubuntu-latest
            platform: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run dist:${{ matrix.platform }}
        env:
          # No signing certificates yet: build unsigned instead of failing.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: froggy-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
